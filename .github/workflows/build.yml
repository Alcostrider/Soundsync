name: Build patches

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the patch bundle
        env:
          # Morphe's build tools come from GitHub Packages; the workflow's own token can read them.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Keep the bundle
        uses: actions/upload-artifact@v5
        with:
          name: SoundSync-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error
