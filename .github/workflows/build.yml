name: Build patches

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # to publish the bundle as a release of this (private) repository
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the patch bundle
        env:
          # Morphe's build tools come from GitHub Packages; the workflow's own token can read them.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Show what's in the bundle
        run: |
          for f in patches/build/libs/*.mpp; do
            echo "== $f"; unzip -l "$f"
          done

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp patches/build/libs/*.mpp SoundSync-patches.mpp
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SoundSync-patches.mpp \
            --title "SoundSync patches (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. In Morphe Manager: Add patch source > Local > pick SoundSync-patches.mpp."
